name: Bug report
description: Something does not work (a crash, a visual or sound problem, bad performance, a build problem)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach or link game files** (disc images, ELF/IRX, extracted assets, captures, RAM dumps, generated code). Issues that do are removed.
        Run logs (`logs/run-*.log`) are fine.
  - type: input
    id: version
    attributes:
      label: Magatama revision or build
      description: The commit you built, or the build number (iOS/Android builds show it in the log's first line).
    validations: {required: true}
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS (Apple silicon), iPhone, iPad, Android, Linux x86-64, Linux ARM64]
    validations: {required: true}
  - type: input
    id: system
    attributes:
      label: Device and OS version
      placeholder: "MacBook Pro M3, macOS 26.1  /  iPad Air M3, iPadOS 26  /  Retroid Pocket 5, Android 13"
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce, and where in the game (area, battle, menu, movie).
    validations: {required: true}
  - type: textarea
    id: settings
    attributes:
      label: Non-default settings
      description: Internal resolution, aspect ratio, 60 FPS mode, anything you changed from the defaults.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the end of the newest run log (macOS ~/magatama/logs, iOS the app's logs folder in Files, Android Documents/Magatama/logs), or attach it.
      render: text
